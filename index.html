<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Học Đọc 3 cùng cô Nana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4; /* Light green background representing growth/learning */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Font for Chinese characters to ensure they look good */
        .zh-text {
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Hide scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Flashcard Flip Animation */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .flashcard-inner {
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        /* Match Game Buttons */
        .match-btn {
            transition: all 0.2s ease;
        }
        .match-btn.selected {
            background-color: #e0e7ff; /* indigo-100 */
            border-color: #6366f1; /* indigo-500 */
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2);
        }
        .match-btn.matched {
            background-color: #d1fae5; /* emerald-100 */
            border-color: #10b981; /* emerald-500 */
            color: #047857; /* emerald-700 */
            opacity: 0.6;
            pointer-events: none;
            transform: scale(0.95);
        }
        .match-btn.error {
            background-color: #ffe4e6; /* rose-100 */
            border-color: #f43f5e; /* rose-500 */
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        /* View transitions */
        .view-section {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .view-section.active {
            display: flex;
            flex-direction: column;
            opacity: 1;
            animation: slideUpFade 0.4s ease-out forwards;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Modern Soft Shadow for Cards */
        .soft-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden text-gray-800 flex justify-center items-center">

    <!-- Mobile Container (Max width for desktop viewing) -->
    <div id="app" class="w-full max-w-md h-full bg-gray-50 shadow-2xl relative flex flex-col overflow-hidden sm:rounded-2xl sm:h-[95vh] sm:border sm:border-gray-200">
        
        <!-- Premium Header Area -->
        <header id="mainHeader" class="bg-white px-5 pt-10 pb-4 shadow-sm z-20 flex-shrink-0 flex items-center justify-between rounded-b-3xl relative">
            <button id="backBtn" class="hidden text-gray-500 p-2 -ml-2 rounded-full hover:bg-gray-100 transition focus:outline-none" onclick="goBack()">

            <div id="headerTitleContainer" class="flex-1 flex flex-col items-center justify-center">

        <!-- Main Content Area -->

                    <div class="relative z-10 flex justify-between items-center mb-4">

            <!-- LESSON MENU VIEW -->

                        <p id="lesson-menu-count" class="text-sm font-medium text-gray-500 mt-1 flex items-center gap-1">

                    <!-- Vocab List -->
                    <button onclick="openActivity('vocab-list')" class="col-span-2 flex items-center p-4 bg-white rounded-2xl soft-shadow active:scale-95 transition-transform border border-transparent hover:border-blue-100">

                            <h3 class="font-bold text-gray-800 text-lg">Từ vựng</h3>

                    <!-- Flashcard -->

                    </button>
                    
                    <!-- Quiz -->
                    <button onclick="openActivity('quiz')" class="flex flex-col items-center p-5 bg-white rounded-2xl soft-shadow active:scale-95 transition-transform border border-transparent hover:border-indigo-100">
                        <div class="bg-indigo-50 p-4 rounded-full mb-3"><svg class="w-8 h-8 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg></div>

                        <p class="text-xs text-gray-500 mt-1 text-center">Trắc nghiệm</p>

                    <!-- Matching -->
                    <button onclick="openActivity('matching')" class="flex flex-col items-center p-5 bg-white rounded-2xl soft-shadow active:scale-95 transition-transform border border-transparent hover:border-purple-100">
                        <div class="bg-purple-50 p-4 rounded-full mb-3"><svg class="w-8 h-8 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg></div>
                        <h3 class="font-bold text-gray-800">Ghép từ</h3>
                        <p class="text-xs text-gray-500 mt-1 text-center">Nối nghĩa</p>
                    </button>
                    
                    <!-- Reading -->
                    <button onclick="openActivity('reading')" class="flex flex-col items-center p-5 bg-white rounded-2xl soft-shadow active:scale-95 transition-transform border border-transparent hover:border-rose-100">
                        <div class="bg-rose-50 p-4 rounded-full mb-3"><svg class="w-8 h-8 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg></div>
                        <h3 class="font-bold text-gray-800">Đọc hiểu</h3>
                        <p class="text-xs text-gray-500 mt-1 text-center">Đoạn văn</p>
                    </button>
                </div>
            </div>

            <!-- VOCABULARY LIST VIEW -->
            <div id="view-vocab-list" class="view-section px-4 py-6 h-full w-full overflow-y-auto no-scrollbar">
                <div class="flex justify-between items-center mb-4 px-2">
                    <p class="text-sm font-semibold text-gray-500 uppercase tracking-wider" id="vocab-list-meta"></p>
                </div>
                <div id="vocab-list-container" class="flex flex-col gap-4 pb-12">
                    <!-- Render by JS -->
                </div>
            </div>

            <!-- FLASHCARD VIEW -->
            <div id="view-flashcard" class="view-section h-full w-full flex flex-col items-center py-6 px-5 relative overflow-hidden bg-gray-50">
                <!-- Progress Bar -->
                <div class="w-full bg-gray-200 rounded-full h-2 mb-2">
                    <div id="fc-progress-bar" class="bg-emerald-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <div class="flex justify-between w-full px-1 mb-6">
                    <span id="fc-progress-text" class="text-gray-500 font-bold text-sm">1 / X</span>
                    <span class="text-emerald-600 font-bold text-sm">Flashcards</span>
                </div>
                
                <!-- Card Area -->
                <div class="flex-1 w-full max-w-sm flex items-center justify-center perspective-1000 my-4 relative">
                    <div id="flashcard-el" class="flashcard w-full h-[60vh] max-h-[400px] relative cursor-pointer" onclick="toggleFlashcard()">
                        <div class="flashcard-inner w-full h-full absolute transform-style-3d soft-shadow rounded-3xl">
                            <!-- Mặt trước (Chữ Hán) -->
                            <div class="absolute w-full h-full bg-white rounded-3xl backface-hidden flex flex-col items-center justify-center p-6 border-b-4 border-gray-100">
                                <span class="absolute top-6 left-6 text-gray-300 text-sm font-bold uppercase">Chữ Hán</span>
                                <h1 id="fc-front-text" class="zh-text text-8xl font-medium text-gray-800 tracking-wider"></h1>
                                <div class="absolute bottom-6 flex flex-col items-center text-gray-400">
                                    <svg class="w-6 h-6 mb-1 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                                    <span class="text-xs font-semibold">Chạm để xem nghĩa</span>
                                </div>
                            </div>
                            <!-- Mặt sau (Pinyin + Nghĩa) -->
                            <div class="absolute w-full h-full bg-gradient-to-b from-emerald-50 to-white rounded-3xl backface-hidden rotate-y-180 flex flex-col items-center justify-center p-8 border-b-4 border-emerald-100 text-center">
                                <span class="absolute top-6 right-6 px-3 py-1 bg-emerald-100 text-emerald-700 rounded-lg text-xs font-bold uppercase" id="fc-back-type"></span>
                                <h2 id="fc-back-pinyin" class="text-4xl text-emerald-600 font-bold mb-6"></h2>
                                <p id="fc-back-meaning" class="text-2xl text-gray-700 font-semibold leading-snug"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="w-full max-w-sm flex gap-4 mt-auto pt-4 pb-4">
                    <button onclick="handleFlashcardResult(false)" class="flex-1 py-4 bg-white border-2 border-rose-200 text-rose-500 rounded-2xl font-bold text-lg active:bg-rose-50 transition-colors shadow-sm flex justify-center items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                        Quên
                    </button>
                    <button onclick="handleFlashcardResult(true)" class="flex-1 py-4 bg-emerald-500 text-white rounded-2xl font-bold text-lg active:bg-emerald-600 transition-colors shadow-md shadow-emerald-200 flex justify-center items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                        Nhớ
                    </button>
                </div>
            </div>

            <!-- QUIZ VIEW -->
            <div id="view-quiz" class="view-section h-full w-full p-5 flex flex-col bg-gray-50 overflow-hidden">

                    <h1 id="quiz-question" class="text-3xl sm:text-4xl font-bold text-gray-800 mb-3 px-2 leading-snug"></h1>
                </div>

                <div id="quiz-options" class="flex flex-col gap-3 pb-2 mt-auto overflow-y-auto no-scrollbar">
                    <!-- Render options by JS -->
                </div>
            </div>

            <!-- MATCHING VIEW -->
            <div id="view-matching" class="view-section h-full w-full p-5 flex flex-col bg-gray-50 overflow-hidden">
                <div class="bg-white rounded-2xl p-4 mb-4 shadow-sm border border-gray-100 flex items-center justify-between shrink-0">
                    <p class="text-gray-600 font-bold text-sm">Nối chữ Hán với nghĩa</p>
                    <div class="bg-purple-100 text-purple-600 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm" id="match-counter">5</div>
                </div>
                
                <div class="flex gap-4 flex-1 pb-2 relative min-h-0">
                    <!-- Cột Hán tự -->
                    <div id="match-col-hanzi" class="flex-1 flex flex-col gap-3 justify-center"></div>
                    <!-- Đường kẻ ở giữa (ảo) -->
                    <div class="w-px bg-gray-200 my-4 absolute left-1/2 transform -translate-x-1/2 h-[90%] z-0"></div>
                    <!-- Cột Nghĩa -->
                    <div id="match-col-meaning" class="flex-1 flex flex-col gap-3 justify-center z-10"></div>
                </div>
                
                <div id="match-success-msg" class="hidden text-center p-4 bg-emerald-50 rounded-2xl mb-4 border border-emerald-200 animate-bounce soft-shadow flex-col items-center shrink-0">
                    <span class="text-4xl mb-2">🎉</span>
                    <p class="text-emerald-700 font-bold text-lg">Tuyệt vời!</p>
                    <p class="text-emerald-600 text-sm">Bạn đã nối đúng tất cả.</p>
                </div>
                
                <button id="match-next-btn" onclick="initMatching()" class="hidden w-full py-4 bg-purple-500 text-white rounded-2xl font-bold shadow-md shadow-purple-200 active:bg-purple-600 mb-2 transition-colors text-lg shrink-0">
                    Chơi tiếp
                </button>
            </div>

            <!-- READING VIEW -->
            <div id="view-reading" class="view-section h-full w-full p-5 flex flex-col bg-gray-50 overflow-hidden">
                <!-- Text Container -->
                <div class="bg-white rounded-3xl p-5 mb-4 overflow-y-auto flex-1 min-h-0 soft-shadow border-t-4 border-rose-400 text-gray-700 leading-relaxed text-base font-medium relative no-scrollbar" id="reading-text-container">
                    <!-- Nội dung bài đọc -->
                </div>
                
                <!-- Question Container -->
                <div class="shrink-0 flex flex-col justify-end pb-2">
                    <div class="bg-rose-50 rounded-2xl p-4 mb-3 border border-rose-100">
                        <h3 class="font-bold text-rose-800 text-sm uppercase tracking-wider mb-2 flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Câu hỏi
                        </h3>
                        <p id="reading-question" class="zh-text text-gray-800 font-bold text-xl leading-snug"></p>
                    </div>
                    
                    <div id="reading-options" class="flex flex-col gap-2 overflow-y-auto no-scrollbar max-h-[40%]">
                        <!-- Đáp án -->
                    </div>
                </div>
            </div>

        </main>
        
        <!-- Toast Notification Container -->
        <div id="toast-container" class="absolute bottom-6 left-0 right-0 flex justify-center pointer-events-none z-50"></div>
    </div>

    <script>
        // --- 1. DỮ LIỆU TỪ VỰNG ---
        const vocabData = [
            {

                word.id = `l${lesson.id}_w${idx}`;
                totalWords++;
            });

        // --- 2. QUẢN LÝ TRẠNG THÁI (STATE) ---
        let appState = {
            currentView: 'home',
            currentLessonId: null,
            viewHistory: [],
            learnedWords: JSON.parse(localStorage.getItem('nana_learned_words')) || {}
        };
        let currentActivityState = {};

        // --- 3. TIỆN ÍCH CHUNG ---
        function saveLearned() {
            localStorage.setItem('nana_learned_words', JSON.stringify(appState.learnedWords));
        }

        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-gray-800';
            if(type === 'success') bgClass = 'bg-emerald-600';
            if(type === 'warning') bgClass = 'bg-orange-500';
            
            toast.className = `${bgClass} text-white px-5 py-3 rounded-full text-sm font-bold shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-2 mb-2`;
            
            let icon = type === 'success' ? `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>` : '';
            toast.innerHTML = `${icon} ${msg}`;
            
            container.appendChild(toast);
            
            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            });
            
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // --- 4. NAVIGATION QUẢN LÝ MÀN HÌNH ---
        function navigateTo(viewId, pushHistory = true) {
            document.querySelectorAll('.view-section').forEach(el => {
                el.classList.remove('active');
            });
            
            const targetView = document.getElementById(`view-${viewId}`);
            targetView.classList.add('active');

            if (pushHistory && appState.currentView !== viewId) {
                appState.viewHistory.push(appState.currentView);
            }
            appState.currentView = viewId;
            updateHeader();
        }

        function goBack() {
            if (appState.viewHistory.length > 0) {
                let prevView = appState.viewHistory.pop();
                navigateTo(prevView, false);
                if(prevView === 'home') renderHome();
            }
        }

        function updateHeader() {
            const backBtn = document.getElementById('backBtn');
            const spacer = document.getElementById('headerSpacer');
            const titleContainer = document.getElementById('headerTitleContainer');
            const mainTitle = document.getElementById('headerMainTitle');
            const subTitle = document.getElementById('headerSubTitle');
            
            if (appState.currentView === 'home') {
                backBtn.classList.add('hidden');
                spacer.classList.add('hidden');
                titleContainer.classList.remove('items-start');
                titleContainer.classList.add('items-center');
                mainTitle.innerText = 'Học Đọc 3';
                subTitle.innerText = 'cùng cô Nana';
                subTitle.classList.remove('hidden');
                document.getElementById('mainHeader').classList.add('justify-center');
                document.getElementById('mainHeader').classList.remove('justify-between');
            } else {
                backBtn.classList.remove('hidden');
                spacer.classList.remove('hidden');
                titleContainer.classList.remove('items-center');
                titleContainer.classList.add('items-center'); // Keep center for consistency but allow layout change
                subTitle.classList.add('hidden');
                document.getElementById('mainHeader').classList.remove('justify-center');
                document.getElementById('mainHeader').classList.add('justify-between');
                
                if (appState.currentView === 'lesson-menu') {
                    let lesson = vocabData.find(l => l.id === appState.currentLessonId);
                    // Lấy phần "Bài X" thôi cho header gọn
                    mainTitle.innerText = lesson.title.split(':')[0];
                } else if (appState.currentView === 'vocab-list') mainTitle.innerText = 'Từ vựng';
                else if (appState.currentView === 'flashcard') mainTitle.innerText = 'Thẻ bài';
                else if (appState.currentView === 'quiz') mainTitle.innerText = 'Trắc nghiệm';
                else if (appState.currentView === 'matching') mainTitle.innerText = 'Ghép từ';
                else if (appState.currentView === 'reading') mainTitle.innerText = 'Đọc hiểu';
            }
        }

        // --- 5. RENDER TRANG CHỦ & MENU ---
        function renderHome() {
            let learnedCount = Object.keys(appState.learnedWords).length;
            
            // Animation for counter
            let start = 0;
            const end = learnedCount;
            const duration = 1000;
            const stepTime = Math.abs(Math.floor(duration / (end || 1)));
            const obj = document.getElementById('stat-learned');
            
            if(end > 0) {
                let timer = setInterval(function() {
                    start += 1;
                    obj.innerText = start;
                    if (start >= end) {
                        clearInterval(timer);
                        obj.innerText = end;
                    }
                }, stepTime);
            } else {
                obj.innerText = 0;
            }

            document.getElementById('stat-total').innerText = totalWords;
            let percent = totalWords > 0 ? (learnedCount / totalWords) * 100 : 0;
            
            // Delay progress bar animation slightly for visual effect
            setTimeout(() => {
                document.getElementById('stat-progress-bar').style.width = `${percent}%`;
            }, 100);

            const listEl = document.getElementById('lesson-list');
            listEl.innerHTML = '';

            vocabData.forEach(lesson => {
                let wordCount = lesson.words.length;
                let learnedInLesson = lesson.words.filter(w => appState.learnedWords[w.id]).length;
                let isLocked = wordCount === 0;
                let action = isLocked ? `showToast('Bài này đang được cập nhật nhé!', 'warning')` : `openLesson(${lesson.id})`;
                let bgClass = isLocked ? 'bg-gray-100 opacity-60' : 'bg-white active:scale-[0.98] cursor-pointer hover:border-emerald-200';
                
                let percentLearned = wordCount > 0 ? (learnedInLesson/wordCount)*100 : 0;
                let isCompleted = wordCount > 0 && learnedInLesson === wordCount;

                let html = `
                    <div onclick="${action}" class="${bgClass} p-4 rounded-2xl flex items-center border border-gray-100 transition-all duration-200 soft-shadow group">
                        <div class="w-14 h-14 rounded-2xl ${isCompleted ? 'bg-emerald-500 text-white' : (isLocked ? 'bg-gray-200 text-gray-400' : 'bg-emerald-100 text-emerald-600')} flex items-center justify-center font-black text-xl shrink-0 mr-4 transition-colors">
                            ${isCompleted ? '<svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>' : lesson.id}
                        </div>
                        <div class="flex-1">
                            <h4 class="font-bold text-gray-800 ${isLocked ? 'text-gray-500' : ''} leading-tight mb-1 text-base group-hover:text-emerald-700 transition-colors">${lesson.title}</h4>
                            ${!isLocked ? `
                                <div class="flex items-center gap-2">
                                    <div class="flex-1 bg-gray-100 rounded-full h-1.5 overflow-hidden">
                                        <div class="bg-emerald-500 h-1.5 rounded-full" style="width: ${percentLearned}%"></div>
                                    </div>
                                    <span class="text-xs font-bold text-gray-400 w-8 text-right">${learnedInLesson}/${wordCount}</span>
                                </div>
                            ` : '<p class="text-xs text-gray-400 font-medium">Sắp ra mắt</p>'}
                        </div>
                    </div>
                `;
                listEl.insertAdjacentHTML('beforeend', html);
            });
        }

        function openLesson(id) {
            appState.currentLessonId = id;
            let lesson = vocabData.find(l => l.id === id);
            
            let titleParts = lesson.title.split(': ');
            document.getElementById('lesson-menu-number').innerText = id;
            document.getElementById('lesson-menu-title').innerText = titleParts[1] || lesson.title;
            document.getElementById('lesson-menu-count').innerHTML = `<svg class="w-4 h-4 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg> <span>${lesson.words.length} từ vựng</span>`;
            
            navigateTo('lesson-menu');
        }

        function openActivity(act) {
            let lesson = vocabData.find(l => l.id === appState.currentLessonId);
            
            // Ngăn chặn lỗi trắng màn hình khi mở bài chưa có dữ liệu
            if (!lesson || !lesson.words || lesson.words.length === 0) {
                showToast("Nội dung bài này đang được cập nhật nhé!", "warning");
                return;
            }
            if (act === 'reading' && !lesson.reading) {
                showToast("Bài đọc đang được biên soạn.", "warning");
                return;
            }

            if(act === 'vocab-list') renderVocabList();
            else if(act === 'flashcard') initFlashcards();
            else if(act === 'quiz') initQuiz();
            else if(act === 'matching') initMatching();
            else if(act === 'reading') initReading();
        }

        // --- 6. CHỨC NĂNG: DANH SÁCH TỪ VỰNG ---
        function renderVocabList() {
            let lesson = vocabData.find(l => l.id === appState.currentLessonId);
            document.getElementById('vocab-list-meta').innerText = `Tổng cộng ${lesson.words.length} từ`;
            const container = document.getElementById('vocab-list-container');
            container.innerHTML = '';

            lesson.words.forEach((w, index) => {
                let isLearned = appState.learnedWords[w.id];
                container.insertAdjacentHTML('beforeend', `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 relative overflow-hidden transition-all ${isLearned ? 'bg-emerald-50/30' : ''}">
                        ${isLearned ? '<div class="absolute top-0 right-0 w-10 h-10 overflow-hidden"><div class="absolute top-0 right-0 w-14 h-14 bg-emerald-500 rotate-45 transform translate-x-7 -translate-y-7"></div><svg class="absolute top-1.5 right-1.5 w-3.5 h-3.5 text-white z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>' : ''}
                        
                        <div class="w-6 text-left text-gray-300 font-bold text-sm">${index + 1}</div>
                        <div class="zh-text text-4xl font-medium text-gray-800 w-[70px] text-center">${w.h}</div>
                        <div class="flex-1 border-l-2 border-gray-100 pl-4 py-1">
                            <p class="text-emerald-600 font-bold text-lg leading-none mb-1">${w.p}</p>
                            <p class="text-gray-700 font-medium text-sm">${w.m}</p>
                            <span class="inline-block mt-1.5 px-2 py-0.5 bg-gray-100 text-gray-500 rounded text-[10px] font-bold uppercase tracking-wider">${w.t}</span>
                        </div>
                    </div>
                `);
            });
            navigateTo('vocab-list');
        }

        // --- 7. CHỨC NĂNG: FLASHCARD ---
        function initFlashcards() {
            let lesson = vocabData.find(l => l.id === appState.currentLessonId);
            currentActivityState.words = shuffleArray([...lesson.words]); 
            currentActivityState.index = 0;
            renderFlashcardCard();
            navigateTo('flashcard');
        }

        function renderFlashcardCard() {
            let words = currentActivityState.words;
            let idx = currentActivityState.index;
            
            if (idx >= words.length) {
                showToast("Đã ôn xong bộ thẻ!", "success");
                setTimeout(goBack, 800);
                return;
            }

            let word = words[idx];
            document.getElementById('fc-progress-text').innerText = `${idx + 1} / ${words.length}`;
            
            let percent = ((idx + 1) / words.length) * 100;
            document.getElementById('fc-progress-bar').style.width = `${percent}%`;
            
            let el = document.getElementById('flashcard-el');
            el.classList.remove('flipped');
            
            // Allow animation to reset if previously flipped
            setTimeout(() => {
                document.getElementById('fc-front-text').innerText = word.h;
                document.getElementById('fc-back-pinyin').innerText = word.p;
                document.getElementById('fc-back-meaning').innerText = word.m;
                document.getElementById('fc-back-type').innerText = word.t;
            }, 150);
        }

        function toggleFlashcard() {
            document.getElementById('flashcard-el').classList.toggle('flipped');
        }

        function handleFlashcardResult(isLearned) {
            let word = currentActivityState.words[currentActivityState.index];
            if (isLearned) {
                appState.learnedWords[word.id] = true;
            } else {
                delete appState.learnedWords[word.id];
            }
            saveLearned();
            
            // Animation vuốt thẻ
            let card = document.getElementById('flashcard-el');
            // Thêm hiệu ứng xoay nhẹ khi vuốt
            let rot = isLearned ? 15 : -15;
            card.style.transform = isLearned ? `translate(100%, -20px) rotate(${rot}deg) scale(0.9)` : `translate(-100%, -20px) rotate(${rot}deg) scale(0.9)`;
            card.style.opacity = '0';
            
            setTimeout(() => {
                card.style.transition = 'none';
                card.style.transform = 'translate(0, 0) rotate(0) scale(0.95)';
                currentActivityState.index++;
                renderFlashcardCard();
                
                // Pop back in
                setTimeout(() => {
                    card.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    card.style.transform = 'translate(0, 0) rotate(0) scale(1)';
                    card.style.opacity = '1';
                }, 50);
            }, 300);
        }

        // --- 8. CHỨC NĂNG: TRẮC NGHIỆM ---
        function initQuiz() {
            let lesson = vocabData.find(l => l.id === appState.currentLessonId);
            currentActivityState.words = shuffleArray([...lesson.words]).slice(0, 10);
            currentActivityState.index = 0;
            currentActivityState.score = 0;
            renderQuizQuestion();
            navigateTo('quiz');
        }

        function renderQuizQuestion() {
            let words = currentActivityState.words;
            let idx = currentActivityState.index;
            let lesson = vocabData.find(l => l.id === appState.currentLessonId);

            if (idx >= words.length) {
                showToast(`Tuyệt! Bạn đúng ${currentActivityState.score}/${words.length} câu`, "success");
                setTimeout(goBack, 1500);
                return;
            }

            let word = words[idx];
            document.getElementById('quiz-progress').innerText = `Câu ${idx + 1}/${words.length}`;
            document.getElementById('quiz-score').innerText = currentActivityState.score;
            document.getElementById('quiz-question').innerText = word.m; // Hiển thị nghĩa tiếng Việt
            document.getElementById('quiz-pinyin').innerText = "Chọn từ tiếng Trung đúng"; // Đã sửa text hợp lý hơn

            // Generate options
            let options = [word];
            let distractors = lesson.words.filter(w => w.id !== word.id);
            distractors = shuffleArray(distractors);
            
            if(distractors.length > 0) options.push(distractors[0]);
            if(distractors.length > 1) options.push(distractors[1]);
            if(distractors.length > 2) options.push(distractors[2]); // 4 options total
            
            options = shuffleArray(options);
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            options.forEach((opt, index) => {
                let letter = String.fromCharCode(65 + index); // A, B, C, D
                let btn = document.createElement('button');
                btn.dataset.id = opt.id; // Gắn ID để lát kiểm tra đáp án đúng
                btn.className = 'w-full p-4 bg-white border-2 border-gray-100 rounded-2xl text-left font-bold text-gray-700 active:scale-[0.98] transition-all flex items-center shadow-sm';
                btn.innerHTML = `
                    <div class="w-8 h-8 rounded-lg bg-gray-100 text-gray-500 flex items-center justify-center mr-4 shrink-0">${letter}</div>
                    <span class="flex-1 zh-text text-3xl text-center text-gray-800">${opt.h}</span>
                `;
                btn.onclick = () => handleQuizAnswer(opt.id === word.id, btn, optionsContainer);
                optionsContainer.appendChild(btn);
            });
        }

        function handleQuizAnswer(isCorrect, btnElement, container) {
            let btns = container.querySelectorAll('button');
            btns.forEach(b => {
                b.onclick = null; // disable clicks
                b.classList.remove('active:scale-[0.98]');
            });

            const iconDiv = btnElement.querySelector('div');
            let delayTimeout = 1000;

            if (isCorrect) {
                btnElement.classList.replace('border-gray-100', 'border-emerald-500');
                btnElement.classList.add('bg-emerald-50', 'text-emerald-700');
                iconDiv.className = 'w-8 h-8 rounded-lg bg-emerald-500 text-white flex items-center justify-center mr-4 shrink-0';
                iconDiv.innerHTML = `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                currentActivityState.score++;
                document.getElementById('quiz-score').innerText = currentActivityState.score;
            } else {
                btnElement.classList.replace('border-gray-100', 'border-rose-500');
                btnElement.classList.add('bg-rose-50', 'text-rose-700');
                iconDiv.className = 'w-8 h-8 rounded-lg bg-rose-500 text-white flex items-center justify-center mr-4 shrink-0';
                iconDiv.innerHTML = `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                
                // HIỂN THỊ ĐÁP ÁN ĐÚNG CHO NGƯỜI DÙNG XEM
                let currentWord = currentActivityState.words[currentActivityState.index];
                btns.forEach(b => {
                    if (b.dataset.id === currentWord.id) {
                        b.classList.replace('border-gray-100', 'border-emerald-500');
                        b.classList.add('border-dashed', 'bg-emerald-50', 'text-emerald-700');
                        let correctIconDiv = b.querySelector('div');
                        correctIconDiv.className = 'w-8 h-8 rounded-lg bg-emerald-500 text-white flex items-center justify-center mr-4 shrink-0';
                        correctIconDiv.innerHTML = `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                    }
                });
                delayTimeout = 1500; // Tăng delay lên một chút để người học kịp xem đáp án đúng
            }

            setTimeout(() => {
                currentActivityState.index++;
                renderQuizQuestion();
            }, delayTimeout);
        }

        // --- 9. CHỨC NĂNG: GHÉP TỪ ---
        function initMatching() {
            let lesson = vocabData.find(l => l.id === appState.currentLessonId);
            let pool = shuffleArray([...lesson.words]).slice(0, 5); 
            
            let hanziList = shuffleArray([...pool]);
            let meaningList = shuffleArray([...pool]);

            currentActivityState = {
                pool: pool,
                selectedHanzi: null,
                selectedMeaning: null,
                matchedCount: 0
            };

            document.getElementById('match-counter').innerText = '5';
            document.getElementById('match-success-msg').classList.add('hidden');
            document.getElementById('match-next-btn').classList.add('hidden');

            const colHanzi = document.getElementById('match-col-hanzi');
            const colMeaning = document.getElementById('match-col-meaning');
            colHanzi.innerHTML = '';
            colMeaning.innerHTML = '';

            hanziList.forEach(w => {
                let btn = document.createElement('button');
                btn.className = 'match-btn w-full p-4 bg-white border-2 border-gray-100 rounded-2xl font-medium text-3xl zh-text text-gray-800 shadow-sm flex items-center justify-center relative overflow-hidden';
                btn.innerText = w.h;
                btn.dataset.id = w.id;
                btn.onclick = () => selectMatchItem(btn, 'hanzi');
                colHanzi.appendChild(btn);
            });

            meaningList.forEach(w => {
                let btn = document.createElement('button');
                btn.className = 'match-btn w-full p-4 bg-white border-2 border-gray-100 rounded-2xl font-bold text-sm text-gray-700 shadow-sm flex items-center justify-center text-center min-h-[68px] relative overflow-hidden';
                btn.innerText = w.m;
                btn.dataset.id = w.id;
                btn.onclick = () => selectMatchItem(btn, 'meaning');
                colMeaning.appendChild(btn);
            });

            navigateTo('matching');
        }

        function selectMatchItem(btn, type) {
            if(btn.classList.contains('matched')) return;

            // Xóa background/border cũ
            let parent = type === 'hanzi' ? document.getElementById('match-col-hanzi') : document.getElementById('match-col-meaning');
            parent.querySelectorAll('button').forEach(b => {
                if(!b.classList.contains('matched')) {
                    b.classList.remove('selected', 'bg-indigo-50', 'border-indigo-400');
                    b.classList.add('bg-white', 'border-gray-100');
                }
            });
            
            btn.classList.remove('bg-white', 'border-gray-100');
            btn.classList.add('selected', 'bg-indigo-50', 'border-indigo-400');

            if (type === 'hanzi') currentActivityState.selectedHanzi = btn;
            else currentActivityState.selectedMeaning = btn;

            if (currentActivityState.selectedHanzi && currentActivityState.selectedMeaning) {
                // Prevent further clicks while checking
                document.querySelectorAll('.match-btn:not(.matched)').forEach(b => b.style.pointerEvents = 'none');
                setTimeout(checkMatch, 300); // Small delay for visual connection
            }
        }

        function checkMatch() {
            let btn1 = currentActivityState.selectedHanzi;
            let btn2 = currentActivityState.selectedMeaning;

            if (btn1.dataset.id === btn2.dataset.id) {
                // Đúng
                [btn1, btn2].forEach(btn => {
                    btn.classList.remove('selected', 'bg-indigo-50', 'border-indigo-400', 'error');
                    btn.classList.add('matched');
                });
                
                currentActivityState.matchedCount++;
                document.getElementById('match-counter').innerText = currentActivityState.pool.length - currentActivityState.matchedCount;
                
                if(currentActivityState.matchedCount === currentActivityState.pool.length) {
                    setTimeout(() => {
                        document.getElementById('match-success-msg').classList.remove('hidden');
                        document.getElementById('match-success-msg').classList.add('flex');
                        document.getElementById('match-next-btn').classList.remove('hidden');
                    }, 400);
                }

                currentActivityState.selectedHanzi = null;
                currentActivityState.selectedMeaning = null;
                
                // Re-enable clicks
                if(currentActivityState.matchedCount !== currentActivityState.pool.length) {
                    document.querySelectorAll('.match-btn:not(.matched)').forEach(b => b.style.pointerEvents = 'auto');
                }
            } else {
                // Sai
                [btn1, btn2].forEach(btn => {
                    btn.classList.remove('selected', 'bg-indigo-50', 'border-indigo-400');
                    btn.classList.add('error');
                });
                
                setTimeout(() => {
                    [btn1, btn2].forEach(btn => {
                        btn.classList.remove('error');
                        btn.classList.add('bg-white', 'border-gray-100');
                    });
                    
                    // CHUYỂN LOGIC RESET VÀO TRONG TIMEOUT ĐỂ NGĂN CLICK BUG
                    currentActivityState.selectedHanzi = null;
                    currentActivityState.selectedMeaning = null;
                    document.querySelectorAll('.match-btn:not(.matched)').forEach(b => b.style.pointerEvents = 'auto');
                }, 500);
            }
        }

        // --- 10. CHỨC NĂNG: ĐỌC HIỂU ---
        function initReading() {
            let lesson = vocabData.find(l => l.id === appState.currentLessonId);
            
            if (!lesson.reading) {
                showToast("Bài đọc đang được biên soạn.", "warning");
                return;
            }

            // Beautifully format pinyin and highlighting the vocab words based on parentheses ( )
            let formattedText = lesson.reading.text.replace(/\((.*?)\)/g, '<span class="inline-block px-2 mx-1 my-1 bg-rose-100 text-rose-700 rounded-md text-[18px] font-bold align-middle shadow-sm leading-none">$1</span>');
            // Format Chinese chars bigger
            formattedText = `<div class="zh-text text-xl sm:text-2xl leading-relaxed">${formattedText}</div>`;
            
            document.getElementById('reading-text-container').innerHTML = formattedText;
            document.getElementById('reading-question').innerText = lesson.reading.question;
            
            const optContainer = document.getElementById('reading-options');
            optContainer.innerHTML = '';
            
            lesson.reading.options.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.className = 'w-full p-4 bg-white border-2 border-gray-100 rounded-2xl text-left font-bold text-gray-700 active:scale-[0.98] transition-all flex items-center shadow-sm';
                btn.innerHTML = `
                    <div class="w-7 h-7 rounded-full border-2 border-gray-300 mr-4 shrink-0 flex items-center justify-center text-transparent transition-colors">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <span class="flex-1 zh-text text-lg">${opt.text}</span>
                `;
                btn.onclick = () => handleReadingAnswer(opt.isCorrect, btn, optContainer);
                optContainer.appendChild(btn);
            });

            navigateTo('reading');
        }

        function handleReadingAnswer(isCorrect, btnElement, container) {
             let btns = container.querySelectorAll('button');
             btns.forEach(b => {
                 b.onclick = null;
                 b.classList.remove('active:scale-[0.98]');
             });

             const iconContainer = btnElement.querySelector('div');

             if(isCorrect) {
                 btnElement.classList.replace('border-gray-100', 'border-emerald-500');
                 btnElement.classList.add('bg-emerald-50', 'text-emerald-700');
                 iconContainer.className = 'w-7 h-7 rounded-full bg-emerald-500 text-white mr-4 shrink-0 flex items-center justify-center transition-colors';
                 showToast("Tuyệt vời! Bạn hiểu bài rất tốt.", "success");
             } else {
                 btnElement.classList.replace('border-gray-100', 'border-rose-500');
                 btnElement.classList.add('bg-rose-50', 'text-rose-700');
                 iconContainer.className = 'w-7 h-7 rounded-full bg-rose-500 text-white mr-4 shrink-0 flex items-center justify-center transition-colors';
                 iconContainer.innerHTML = `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                 
                 // Show correct answer rõ ràng và chuẩn UI hơn
                 let optionsData = vocabData.find(l => l.id === appState.currentLessonId).reading.options;
                 btns.forEach((b, idx) => {
                     if(optionsData[idx].isCorrect) {
                         b.classList.replace('border-gray-100', 'border-emerald-500');
                         b.classList.add('border-dashed', 'bg-emerald-50', 'text-emerald-700');
                         let correctIcon = b.querySelector('div');
                         correctIcon.className = 'w-7 h-7 rounded-full bg-emerald-500 text-white mr-4 shrink-0 flex items-center justify-center transition-colors';
                     }
                 });
             }

             // Tự động chuyển về menu bài học
             setTimeout(() => {
                 goBack();
             }, 2500);
        }

        // --- KHỞI TẠO ỨNG DỤNG ---
        window.onload = () => {
            renderHome();
            // Prevent pull-to-refresh on mobile browsers for app-like feel
            document.body.addEventListener('touchmove', function(e) {
                // Allow scrolling inside specific containers
                if (!e.target.closest('.overflow-y-auto') && !e.target.closest('#reading-text-container')) {
                    e.preventDefault();
                }
            }, { passive: false });
        };
    </script>
</body>
